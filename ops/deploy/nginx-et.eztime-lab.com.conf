server {
    listen 80;
    listen [::]:80;
    server_name et.eztime-lab.com;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/et.eztime-lab.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name et.eztime-lab.com;

    ssl_certificate /etc/letsencrypt/live/et.eztime-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/et.eztime-lab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ET_SSL:10m;
    ssl_session_timeout 1d;

    access_log /www/wwwlogs/et.eztime-lab.com.log;
    error_log /www/wwwlogs/et.eztime-lab.com.error.log;

    location ~ ^/(rpc|api)(/|$) {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        access_log off;
    }

    location /assets/ {
        root /www/wwwroot/et.eztime-lab.com;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /www/wwwroot/et.eztime-lab.com;
        index index.html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        # SPA HTML 由 nginx 托管,补齐应用层无法覆盖的安全头
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
